# Testes dos scripts Python (fixtures descartáveis; nunca os dados reais).
name: testes dos scripts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
